<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <meta name="description" content="{{ site.bio_mini }}">
    <meta name="author" content="{{ site.nome }}">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url_site }}">
    <meta property="og:title" content="{{ site.nome }} | {{ site.cargo_principal }}">
    <meta property="og:description" content="{{ site.og_description }}">
    <meta property="og:image" content="{{ site.og_image | relative_url }}">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ site.url_site }}">
    <meta property="twitter:title" content="{{ site.nome }} | {{ site.cargo_principal }}">
    <meta property="twitter:description" content="{{ site.og_description }}">
    <meta property="twitter:image" content="{{ site.og_image | relative_url }}">

    <link rel="icon" type="image/png" href="{{ site.favicon | relative_url }}">
    <link rel="apple-touch-icon" href="{{ site.favicon | relative_url }}">
    
    <title>{{ site.nome }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="container">
        {{ content }}

        <footer>
            <p class="mono">system.exit(0);</p>
            <p>&copy; {{ "now" | date: "%Y" }} {{ site.nome }}. {{ site.footer_extra }}</p>
        </footer>
    </div>

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>

</body>
</html>
