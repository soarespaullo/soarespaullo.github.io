# ==========================================================================
# SEÇÃO: WHOAMI (Sobre)
# --------------------------------------------------------------------------
sobre_texto: >
  Sou graduado em Segurança da Informação e pós-graduado em <span class="highlight-bold">Defesa Cibernética</span> e <span class="highlight-bold">Perícia Forense Computacional</span>. 
  Com mais de <span class="highlight-bold">cinco anos de experiência</span> na administração de sistemas, atuo diretamente na configuração e manutenção de redes, servidores e infraestrutura de TI. 
  Minhas competências unem o suporte técnico avançado à implementação de práticas de defesa cibernética e <span class="highlight-bold">investigação forense</span>. 
  Tenho foco em garantir a <span class="highlight-bold">resiliência de ambientes computacionais</span> através de metodologias de <span class="highlight-bold">Hardening</span> e monitoramento ativo, aplicando políticas de segurança que garantem a tríade <span class="highlight-bold">CID</span> (Confidencialidade, Integridade e Disponibilidade).

# ==========================================================================
# SEÇÃO: CAT /ETC/GOALS (Objetivos)
# --------------------------------------------------------------------------
objetivos_texto: >
  Meu objetivo é me consolidar como especialista em Segurança da Informação, com foco em ambientes 
  <span class="highlight-bold">Linux</span>, infraestrutura corporativa e resposta a incidentes. 
  Tenho grande interesse em atuar com segurança ofensiva, automação com <span class="highlight-bold">Python</span>, 
  hardening de servidores e análise forense digital. Busco constantemente aprimorar minhas habilidades 
  em detecção e mitigação de ameaças, análise de vulnerabilidades e implementação de políticas de segurança.

